<head>
<meta charset="utf-8">

<title>Last ned Regissøren</title>
<meta name="description" content="Last ned Regissøren fra App Store eller Google Play.">
<link rel="canonical" href="https://hansifed.github.io/regissoren/last-ned/">
<meta name="robots" content="noindex">

<style>body{min-height:100vh;display:grid;place-items:center;text-align:center}main{padding:40px 20px}h1{font-size:clamp(40px,9vw,64px);margin:16px 0}.stores{justify-content:center;margin:24px 0}img.logo{width:110px;margin:0 auto}</style>
<script src="../assets/lenker.js"></script>
<script>
// Sends phones straight to their own store. Everyone else sees both buttons.
(function () {
  var L = window.REGISSOREN || {}, ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  if (ios && L.APP_STORE_LIVE) location.replace(L.APP_STORE);
  else if (android && L.PLAY_STORE_LIVE) location.replace(L.PLAY_STORE);
})();
</script>
</head>
<body>
<main>
  <img class="logo" src="../assets/img/logo.png" alt="">
  <h1>Last ned <span class="y">Regissøren</span></h1>
  <p>Velg butikken til telefonen din.</p>
  <div class="stores" data-stores></div>
  <p class="fine"><a href="../">Til forsiden</a></p>
</main>
<script src="../assets/main.js"></script>
</body>
</html>
